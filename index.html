
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nana Lashes | Book Online</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf5f2;
      color: #443735;
      font-family: Arial, sans-serif;
    }
    header {
      background: #fff;
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid #ebdfd9;
    }
    .logo {
      font-family: Georgia, serif;
      font-size: 32px;
      letter-spacing: 3px;
    }
    .subtitle {
      font-size: 12px;
      letter-spacing: 3px;
      color: #ad8786;
    }
    main {
      max-width: 520px;
      margin: 55px auto;
      padding: 0 20px;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 34px;
      text-align: center;
    }
    .intro {
      color: #917b75;
      text-align: center;
      margin-bottom: 35px;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 35px #5a34340c;
    }
    h3 { font-size: 15px; margin: 12px 0 16px; }
    .slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    button, input, select {
      font: inherit;
      padding: 13px;
      border-radius: 8px;
    }
    .slot {
      background: #fff;
      border: 1px solid #e6d4cf;
      cursor: pointer;
    }
    .slot.selected {
      background: #b78d8c;
      color: white;
      border-color: #b78d8c;
    }
    input, select {
      width: 100%;
      border: 1px solid #e6d4cf;
      margin-bottom: 12px;
      background: white;
    }
    label { display: block; margin-bottom: 8px; }
    .primary {
      width: 100%;
      border: none;
      background: #b78d8c;
      color: white;
      cursor: pointer;
      margin-top: 12px;
    }
    .notice {
      font-size: 13px;
      color: #927a73;
      text-align: center;
      line-height: 1.6;
    }
    footer {
      text-align: center;
      padding: 35px;
      color: #a38b84;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">NANA LASHES</div>
    <div class="subtitle">LASH STUDIO</div>
  </header>

  <main>
    <h1>Book Your Appointment</h1>
    <p class="intro">Your perfect lashes are just a click away.</p>

    <div class="card">
      <h3>1. Choose a date</h3>
      <input type="date" id="date">

      <h3>2. Choose a time</h3>
      <div class="slots" id="slots"></div>

      <h3>3. Your information</h3>
      <form id="bookingForm">
        <label for="name">Full name</label>
        <input id="name" required placeholder="Your name">

        <label for="phone">Phone number</label>
        <input id="phone" type="tel" required placeholder="Your phone number">

        <button class="primary" type="submit">
          Preview Appointment
        </button>
      </form>
      <p class="notice" id="message">
        Demo only. Online booking is not connected yet.
      </p>
    </div>
  </main>

  <footer>© Nana Lashes · Made with love ♡</footer>

 
 
  <script>
    // Replace with your actual Supabase details
    const SUPABASE_URL = "https://xwokxjyjkrjhouwhzmmz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_BCdj-ZlHyxGVVKqlCaw71A_j02OECtV";
  
    const dateInput = document.getElementById("date");
    const slotsBox = document.getElementById("slots");
    const message = document.getElementById("message");
    const form = document.getElementById("bookingForm");
    const submitButton = form.querySelector("button[type=submit]");
  
    let selectedSlot = null;
  
    // Get current Toronto date
    function torontoToday() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Toronto",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
  
      const get = type => parts.find(p => p.type === type).value;
      return `${get("year")}-${get("month")}-${get("day")}`;
    }
  
    dateInput.min = torontoToday();
    dateInput.value = torontoToday();
  
    // Convert database time to AM/PM
    function formatTime(time) {
      const [hours, minutes] = time.split(":").map(Number);
      const period = hours >= 12 ? "PM" : "AM";
      const hour = hours % 12 || 12;
  
      return `${hour}:${String(minutes).padStart(2, "0")} ${period}`;
    }
  
    // Secure Supabase function request
    async function callSupabase(functionName, data) {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/${functionName}`,
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        }
      );
  
      if (!response.ok) {
        throw new Error(`Supabase request failed: ${response.status}`);
      }
  
      return response.json();
    }
  
    // Load only available appointments
    async function loadSlots() {
      selectedSlot = null;
      slotsBox.textContent = "Loading available times...";
  
      try {
        const requestedDate = dateInput.value;
  
        const available = await callSupabase(
          "get_available_slots",
          { p_date: requestedDate }
        );
  
        // Ignore outdated responses if the date changed
        if (requestedDate !== dateInput.value) return;
  
        slotsBox.replaceChildren();
  
        if (available.length === 0) {
          slotsBox.textContent = "No available times for this date.";
          return;
        }
  
        available.forEach(slot => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "slot";
          button.textContent = formatTime(slot.slot_time);
  
          button.onclick = () => {
            selectedSlot = slot;
  
            document.querySelectorAll(".slot").forEach(b => {
              b.classList.remove("selected");
            });
  
            button.classList.add("selected");
            message.textContent =
              "Selected: " + formatTime(slot.slot_time);
          };
  
          slotsBox.appendChild(button);
        });
      } catch (error) {
        console.error(error);
        slotsBox.textContent = "Unable to load appointments.";
        message.textContent = "Please try again later.";
      }
    }
  
    dateInput.addEventListener("change", () => {
      message.textContent = "Select an available appointment.";
      loadSlots();
    });
  
    // Submit a real customer booking
    form.addEventListener("submit", async event => {
      event.preventDefault();
  
      if (!selectedSlot) {
        message.textContent = "Please choose an appointment time.";
        return;
      }
  
      const slot = selectedSlot;
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
  
      submitButton.disabled = true;
      submitButton.textContent = "Booking...";
  
      try {
        const success = await callSupabase(
          "book_appointment",
          {
            p_slot_id: slot.id,
            p_name: name,
            p_phone: phone
          }
        );
  
        if (success === true) {
          form.reset();
  
          message.textContent =
            "Booking Confirmed! " +
            slot.slot_date + " at " + formatTime(slot.slot_time) +
            ". Thank you for booking with Nana Lashes!";
  
          await loadSlots();
        } else {
          message.textContent =
            "This time is no longer available, or your information is invalid. Please try again.";
          await loadSlots();
        }
      } catch (error) {
        console.error(error);
        message.textContent =
          "Could not confirm your booking. Please contact Nana Lashes before trying again.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Confirm Booking";
      }
    });
  
    submitButton.textContent = "Confirm Booking";
  
    loadSlots();
  </script>

</body>
</html>
